name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 0 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ARCH: ["amd64"]
    env:
      DOCKER_IMAGE: nventiveux/docker-valheim

    steps:
      - uses: actions/checkout@v7

      - name: Hadolint
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: Dockerfile

      - name: Build
        run: |
          docker build -t "${DOCKER_IMAGE}:latest" -f "Dockerfile" .
          docker images

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '%s' "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push "${DOCKER_IMAGE}"
          docker logout
